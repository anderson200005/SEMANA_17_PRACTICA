{% extends 'core/base.html' %}
{% block content %}
    <h2>Confirmar Eliminación</h2>
    <p>¿Estás seguro de que deseas eliminar <strong>{{ item }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-eliminar">Sí, eliminar</button>
        <a href="{% url cancel_url %}" class="btn" style="background: #6c757d;">Cancelar</a>
    </form>
{% endblock %}

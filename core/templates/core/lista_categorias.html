{% extends 'core/base.html' %}
{% block content %}
    <h2>Categorías</h2>
    <a href="{% url 'crear_categoria' %}" class="btn btn-crear">+ Nueva Categoría</a>
    <table>
        <tr><th>Nombre</th><th>Descripción</th><th>Activa</th><th>Acciones</th></tr>
        {% for item in items %}
        <tr>
            <td>{{ item.nombre }}</td>
            <td>{{ item.descripcion }}</td>
            <td>{{ item.activa|yesno:"Sí,No" }}</td>
            <td>
                <a href="{% url 'editar_categoria' item.pk %}" class="btn btn-editar">Editar</a>
                <a href="{% url 'eliminar_categoria' item.pk %}" class="btn btn-eliminar">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}

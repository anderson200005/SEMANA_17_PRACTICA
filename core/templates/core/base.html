<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Práctica Semana 17 - Django</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
        nav { background: #333; padding: 10px; margin-bottom: 20px; border-radius: 5px; }
        nav a { color: white; text-decoration: none; margin-right: 15px; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        .btn { padding: 6px 12px; text-decoration: none; color: white; border-radius: 4px; border: none; cursor: pointer; display: inline-block; }
        .btn-crear { background: #28a745; margin-bottom: 10px; }
        .btn-editar { background: #ffc107; color: black; }
        .btn-eliminar { background: #dc3545; }
        form p { margin-bottom: 12px; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
        input[type="checkbox"] { width: auto; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'lista_categorias' %}">Categorías</a>
        <a href="{% url 'lista_libros' %}">Libros</a>
        <a href="{% url 'lista_prestamos' %}">Préstamos</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>

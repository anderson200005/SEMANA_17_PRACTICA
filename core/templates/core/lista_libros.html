{% extends 'core/base.html' %}
{% block content %}
    <h2>Libros</h2>
    <a href="{% url 'crear_libro' %}" class="btn btn-crear">+ Nuevo Libro</a>
    <table>
        <tr><th>Título</th><th>Autor</th><th>Precio</th><th>Categoría</th><th>Acciones</th></tr>
        {% for item in items %}
        <tr>
            <td>{{ item.titulo }}</td>
            <td>{{ item.autor }}</td>
            <td>${{ item.precio }}</td>
            <td>{{ item.categoria.nombre }}</td>
            <td>
                <a href="{% url 'editar_libro' item.pk %}" class="btn btn-editar">Editar</a>
                <a href="{% url 'eliminar_libro' item.pk %}" class="btn btn-eliminar">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
